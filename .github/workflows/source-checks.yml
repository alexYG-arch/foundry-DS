name: Foundry public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Public source and portable smoke (${{ matrix.os }}; not release acceptance)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The gate loads a platform-specific required set: the common modules
        # everywhere, plus the real-sandbox modules of the platform that has
        # that sandbox (seatbelt on macOS). A red job on one OS is a real
        # failure of that OS's set, not a missing-sandbox skip.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install optional Linux sandbox (bubblewrap) for local hardening probes
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Install declared test dependencies
        run: python -m pip install '.[test,security]'
      - name: Run required public checks (skips fail)
        run: python -B tools/check_release_source.py --report build/source-checks.json
      - name: Record gate diagnostics
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("build/source-checks.json")
          if not path.is_file():
              print("## Gate report missing\n")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          tests = data.get("tests", {})
          print("## Public source checks: " + str(data.get("status")))
          print("")
          print(f"platform: {data.get('platform_set')}  discovered: {tests.get('discovered')}  passed: {tests.get('passed')}  skipped: {len(tests.get('skipped', []))}  failures: {len(tests.get('failures', []))}  errors: {len(tests.get('errors', []))}")
          for key in ("failures", "errors", "skipped"):
              for item in tests.get(key, [])[:20]:
                  print(f"- **{key}**: `{item}`")
          missing = data.get("missing_modules", [])
          if missing:
              print(f"- **missing modules**: `{missing}`")
          load_errors = data.get("load_errors", [])
          if load_errors:
              print(f"- **load errors**: `{load_errors[:5]}`")
          PY

      - name: Re-run the local TCP gate probe with diagnostics
        if: failure()
        env:
          PYTHONPATH: src:tests
        run: |
          python -m unittest -v test_build_resources.BuildResourceIntegrationTests.test_local_tcp_capture_recovers_without_restarting_service_or_double_budget 2>&1 | tee /tmp/local-tcp.log
          tail -60 /tmp/local-tcp.log | while IFS= read -r line; do echo "::error title=Local TCP probe::$line"; done
          grep 'RECOVERY_RESULT=' /tmp/local-tcp.log | tail -1 | while IFS= read -r line; do echo "::error title=Recovery result::$line"; done
          grep 'RECOVERY_DETAIL=' /tmp/local-tcp.log | tail -1 | while IFS= read -r line; do echo "::error title=Recovery detail::$line"; done

      - name: Annotate gate failure facts
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/source-checks.json")
          if not path.is_file():
              print("::error title=Gate report::missing build/source-checks.json")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          tests = data.get("tests", {})
          print(f"::error title=Gate status::{data.get('status')} discovered={tests.get('discovered')} passed={tests.get('passed')} skipped={len(tests.get('skipped', []))} failures={len(tests.get('failures', []))} errors={len(tests.get('errors', []))}")
          for key in ("failures", "errors", "skipped"):
              for item in tests.get(key, [])[:12]:
                  print(f"::error title=Gate {key}::{item}")
          for item in data.get("missing_modules", [])[:8]:
              print(f"::error title=Gate missing::{item}")
          PY

      - name: Preserve diagnostic summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-source-checks-${{ matrix.os }}
          path: build/source-checks.json
          if-no-files-found: error
